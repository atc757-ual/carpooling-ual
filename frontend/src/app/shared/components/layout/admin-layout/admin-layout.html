<ion-header class="admin-header">
  <div class="admin-header__bar">
    <a class="admin-header__brand" routerLink="/admin">Carpooling UAL · Admin</a>
    <div class="admin-header__account">
      <!-- Menú de la cuenta: volver a la app (si también conduce o viaja) y
           cerrar sesión, que cierra las dos partes -->
      <ion-button id="admin-account-trigger" class="admin-header__account-button" fill="clear">
        <ion-icon slot="start" [icon]="accountIcon" aria-hidden="true" />
        <span class="admin-header__email">{{ email() }}</span>
        <ion-icon slot="end" [icon]="menuIcon" aria-hidden="true" />
      </ion-button>
      <ion-popover trigger="admin-account-trigger" [dismissOnSelect]="true">
        <ng-template>
          <ion-list class="admin-account-menu" lines="none">
            @if (canUseApp()) {
              <ion-item button [detail]="false" (click)="handleGoToApp()">
                <ion-icon slot="start" [icon]="appIcon" aria-hidden="true" />
                <ion-label>Ir a la app</ion-label>
              </ion-item>
            }
            <ion-item button [detail]="false" (click)="handleLogout()">
              <ion-icon slot="start" [icon]="logoutIcon" aria-hidden="true" />
              <ion-label>Cerrar sesión</ion-label>
            </ion-item>
          </ion-list>
        </ng-template>
      </ion-popover>
    </div>
    <nav class="admin-nav" aria-label="Secciones del panel">
      @for (section of sections; track section.path) {
        <a
          class="admin-nav__link"
          [routerLink]="section.path"
          routerLinkActive="admin-nav__link--active"
          ariaCurrentWhenActive="page"
        >
          <ion-icon class="admin-nav__icon" [icon]="section.icon" aria-hidden="true" />
          {{ section.label }}
          @if (section.path === incidentsPath && openIncidents() > 0) {
            <span class="admin-nav__badge">
              {{ openIncidents() }}<span class="visually-hidden"> abiertas</span>
            </span>
          }
        </a>
      }
    </nav>
  </div>
</ion-header>

<ion-content>
  <main class="admin-main">
    <router-outlet />
  </main>
</ion-content>
