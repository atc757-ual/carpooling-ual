<app-modal-header [title]="title" (closed)="close()" />

<ion-content class="ion-padding">
  @if (content(); as text) {
    <!-- Angular limpia el HTML (sin scripts ni estilos) antes de mostrarlo -->
    <article class="legal" [innerHTML]="text"></article>
  } @else if (hasError()) {
    <p class="text-body" role="alert">
      No hemos podido cargar el texto. Comprueba tu conexión e inténtalo de nuevo.
    </p>
  } @else {
    <div class="legal__loading">
      <ion-spinner name="crescent" aria-label="Cargando el texto" />
    </div>
  }
</ion-content>
