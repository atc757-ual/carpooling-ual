<!-- Sin ✕: se cierra con «Entendido», al final del texto (también
     arrastrando la hoja, tocando fuera o con Escape) -->
<app-modal-header [title]="title" [hasClose]="false" />

<!-- Sin ion-content: así la ventana toma el alto del texto (con su propio
     scroll si no cabe) -->
<div class="modal-body">
  <app-legal-document
    [type]="document"
    [isEndTracked]="!!onReachedEnd"
    (reachedEnd)="onReachedEnd?.()"
  />
  <!-- Al final del texto, con él -->
  <form class="legal__footer" (submit)="$event.preventDefault(); close()">
    <ion-button type="submit" expand="block">{{ understoodLabel }}</ion-button>
  </form>
</div>
