<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<form class="modal-body confirm" (submit)="$event.preventDefault(); handleConfirm()">
  <ion-icon class="confirm__icon" [icon]="icon" aria-hidden="true" />
  <h2 class="text-subtitle">{{ header }}</h2>
  <p class="text-body-s text-color-muted">{{ message }}</p>

  <div class="reason">
    <ion-textarea
      class="reason__field"
      [label]="computedFieldLabel"
      labelPlacement="stacked"
      fill="outline"
      rows="3"
      [maxlength]="maxLength"
      [counter]="true"
      [value]="reason()"
      [helperText]="computedHelperText"
      (ionInput)="handleReasonInput($event)"
    />
    @if (errorMessage(); as error) {
      <p class="reason__error text-body-s" role="alert">{{ error }}</p>
    }
  </div>

  <!-- El azul va siempre primero: arriba en el móvil y a la izquierda en
       escritorio. Si la acción es destructiva, lo principal (azul) es cancelar
       y la acción va en blanco con letras azules (como en confirm-modal) -->
  <div class="confirm__actions">
    @if (isDestructive) {
      <ion-button type="button" expand="block" (click)="handleCancel()">{{
        computedCancelText
      }}</ion-button>
      <ion-button
        class="confirm__secondary"
        type="submit"
        expand="block"
        fill="outline"
        [disabled]="!isReasonValid() || isSaving()"
      >
        {{ confirmText }}
      </ion-button>
    } @else {
      <ion-button type="submit" expand="block" [disabled]="!isReasonValid() || isSaving()">
        {{ confirmText }}
      </ion-button>
      <ion-button
        class="confirm__cancel"
        type="button"
        expand="block"
        fill="outline"
        (click)="handleCancel()"
        >{{ computedCancelText }}</ion-button
      >
    }
  </div>
</form>
