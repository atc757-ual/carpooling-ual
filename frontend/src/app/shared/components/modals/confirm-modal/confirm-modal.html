<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<div class="confirm" [class.confirm--destructive]="isDestructive">
  <ion-icon class="confirm__icon" [icon]="icon" aria-hidden="true" />
  <h2 class="text-subtitle">{{ header }}</h2>
  <p class="text-body-s text-color-muted">{{ message }}</p>
  <div class="confirm__actions">
    <!-- En formularios: cada botón envía el suyo (sin click en ion-button) -->
    <form (submit)="$event.preventDefault(); handleConfirm()">
      <ion-button type="submit" expand="block" [color]="isDestructive ? 'danger' : 'primary'">
        {{ confirmText }}
      </ion-button>
    </form>
    <form (submit)="$event.preventDefault(); handleCancel()">
      <ion-button class="confirm__cancel" type="submit" expand="block" fill="outline">
        {{ cancelText }}
      </ion-button>
    </form>
  </div>
</div>
