<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<div class="modal-body confirm">
  <ion-icon class="confirm__icon" [icon]="icon" aria-hidden="true" />
  <h2 class="text-subtitle">{{ header }}</h2>
  <p class="text-body-s text-color-muted">{{ message }}</p>
  <!-- En formularios: cada botón envía el suyo (sin click en ion-button). El
       botón azul (el principal) va primero: arriba en el móvil y a la derecha
       en escritorio. Si la acción es destructiva, lo principal es cancelar y
       la acción va en blanco con letras azules -->
  <div class="confirm__actions">
    @if (isDestructive) {
      <form (submit)="$event.preventDefault(); handleConfirm()">
        <ion-button class="confirm__secondary" type="submit" expand="block" fill="outline">
          {{ confirmText }}
        </ion-button>
      </form>
      <form (submit)="$event.preventDefault(); handleCancel()">
        <ion-button type="submit" expand="block">{{ cancelText }}</ion-button>
      </form>
    } @else {
      <form (submit)="$event.preventDefault(); handleConfirm()">
        <ion-button type="submit" expand="block">{{ confirmText }}</ion-button>
      </form>
      <form (submit)="$event.preventDefault(); handleCancel()">
        <ion-button class="confirm__cancel" type="submit" expand="block" fill="outline">
          {{ cancelText }}
        </ion-button>
      </form>
    }
  </div>
</div>
