@if (isVisible()) {
  <ion-card class="mode-selector">
    <ion-card-header>
      <ion-card-title>¿Cómo viajas hoy?</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-segment
        class="mode-selector__segment"
        aria-label="Modo activo"
        [value]="mode()"
        (ionChange)="handleModeChange($event.detail.value)"
      >
        <ion-segment-button value="passenger">
          <ion-label>Pasajero</ion-label>
        </ion-segment-button>
        <ion-segment-button value="driver">
          <ion-label>Conductor</ion-label>
        </ion-segment-button>
      </ion-segment>
      <ion-note class="text-caption"
        >Tienes los dos perfiles; solo uno está activo a la vez.</ion-note
      >
    </ion-card-content>
  </ion-card>
}
