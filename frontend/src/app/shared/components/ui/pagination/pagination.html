<nav class="pagination" [attr.aria-label]="computedAriaLabel()">
  <span class="pagination__range" aria-live="polite">{{ range() }}</span>
  <div class="pagination__actions">
    <ion-button
      fill="outline"
      size="small"
      [disabled]="!hasPrevious() || isLoading()"
      (click)="handlePrevious()"
      >{{ computedPreviousLabel() }}</ion-button
    >
    <ion-button
      fill="outline"
      size="small"
      [disabled]="!hasNext() || isLoading()"
      (click)="handleNext()"
      >{{ computedNextLabel() }}</ion-button
    >
  </div>
</nav>
