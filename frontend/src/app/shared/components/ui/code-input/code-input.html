<!-- Solo cifras (type number de ion-input-otp: el valor sigue siendo texto,
     así un código que empieza por cero conserva ese cero). Sin patrón propio:
     Angular lo aplicaría como validador del código entero. one-time-code: el móvil
     ofrece el código recibido. Al rellenar la última casilla (o pegar el
     código) se envía solo (completed) -->
<ion-input-otp
  [formControl]="code"
  [length]="codeLength"
  type="number"
  inputmode="numeric"
  autocomplete="one-time-code"
  fill="outline"
  shape="soft"
  [attr.aria-labelledby]="labelledBy()"
  [class.code-input--shake]="isShaking()"
  (ionComplete)="completed.emit()"
/>
