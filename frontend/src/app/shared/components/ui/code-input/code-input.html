<!-- De tipo texto con teclado numérico (no de tipo número): así un código que
     empieza por cero conserva ese cero. Sin patrón propio: Angular lo
     aplicaría como validador del código entero. one-time-code: el móvil
     ofrece el código recibido. Al rellenar la última casilla (o pegar el
     código) se envía solo (completed) -->
<ion-input-otp
  [formControl]="code"
  [length]="codeLength"
  type="text"
  inputmode="numeric"
  autocomplete="one-time-code"
  fill="outline"
  shape="soft"
  [attr.aria-labelledby]="labelledBy()"
  [class.code-input--shake]="isShaking()"
  (ionComplete)="completed.emit()"
/>
