@if (combobox.isOpen()) {
  <!-- Lista del combobox del campo (appCombobox): el foco se queda en el
       campo y las flechas resaltan la opción. mousedown sin acción: al pulsar
       con el ratón el campo no pierde el foco (sin blur no se marca como
       tocado ni enseña el error) -->
  <div
    class="email-suggestions"
    role="listbox"
    aria-label="Sugerencias de correo"
    [id]="combobox.listId"
  >
    @for (suggestion of suggestions(); track suggestion.email; let index = $index) {
      <div
        class="email-suggestions__option"
        role="option"
        [id]="combobox.optionId(index)"
        [class.email-suggestions__option--active]="combobox.activeIndex() === index"
        [attr.aria-selected]="combobox.activeIndex() === index"
        (mousedown)="$event.preventDefault()"
        tabindex="-1"
        (click)="handleChoose(suggestion.email)"
        (keydown.enter)="handleChoose(suggestion.email)"
      >
        <span class="email-suggestions__email">{{ suggestion.email }}</span>
        <span class="text-caption text-color-muted">{{ suggestion.audience }}</span>
      </div>
    }
  </div>
}
