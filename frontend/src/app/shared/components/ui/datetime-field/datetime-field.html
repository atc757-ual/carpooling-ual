<span [id]="labelId" class="text-label text-label--strong">{{ label() }}</span>
<!-- Botón propio (no ion-datetime-button) para poder leer «Hoy» o «Mañana»,
     igual en el móvil y en el escritorio -->
<button
  #trigger
  type="button"
  class="datetime-field__box"
  [attr.aria-labelledby]="labelId + ' ' + pickerId + '-value'"
  aria-haspopup="dialog"
  [disabled]="control.disabled"
  (click)="handleOpen(trigger)"
>
  <ion-icon [icon]="icon()" aria-hidden="true" />
  <span [id]="pickerId + '-value'" class="datetime-field__value">{{ displayValue() }}</span>
</button>
@if (isDesktop()) {
  <!-- Escritorio: el calendario o las ruedas en un desplegable bajo el campo -->
  <ion-popover
    class="datetime-popover"
    side="bottom"
    alignment="start"
    [showBackdrop]="false"
    [keepContentsMounted]="true"
    [isOpen]="isOpen()"
    [event]="anchor()"
    (didDismiss)="isOpen.set(false)"
  >
    <ng-template>
      <ng-container [ngTemplateOutlet]="pickerContent" />
    </ng-template>
  </ion-popover>
} @else {
  <!-- Móvil: la hoja que sube desde abajo, con la muesca (estilos del tema) -->
  <ion-modal
    class="datetime-modal"
    [keepContentsMounted]="true"
    [isOpen]="isOpen()"
    (didDismiss)="isOpen.set(false)"
  >
    <ng-template>
      <ng-container [ngTemplateOutlet]="pickerContent" />
    </ng-template>
  </ion-modal>
}

<!-- El calendario o las ruedas de la hora de Ionic -->
<ng-template #pickerContent>
  @if (presentation() === 'date') {
    <ion-datetime
      #picker
      [id]="pickerId"
      [formControl]="control"
      presentation="date"
      [formatOptions]="{ date: { day: 'numeric', month: 'short' } }"
      [locale]="pickerLocale()"
      [firstDayOfWeek]="1"
      [min]="min()"
      [max]="max()"
      [showDefaultButtons]="!isDesktop()"
      (ionChange)="handleDatePicked()"
    >
      <!-- En el escritorio, como un desplegable: al pulsar el día se elige y se
           cierra, sin «Cancelar» ni «Aceptar» -->
      @if (!isDesktop()) {
        <ng-container *ngTemplateOutlet="actions; context: { $implicit: picker }" />
      }
    </ion-datetime>
  } @else {
    <ion-datetime
      #picker
      [id]="pickerId"
      [formControl]="control"
      presentation="time"
      [locale]="pickerLocale()"
      hourCycle="h23"
      [minuteValues]="minuteValues"
      [showDefaultButtons]="true"
    >
      <ng-container *ngTemplateOutlet="actions; context: { $implicit: picker }" />
    </ion-datetime>
  }
</ng-template>

<ng-template #actions let-picker>
  <!-- La acción primero, a la izquierda, y volver atrás después (guía, «Botones») -->
  <div slot="buttons" class="datetime-actions">
    <button
      type="button"
      class="datetime-actions__button datetime-actions__button--primary"
      (click)="picker.confirm(true)"
    >
      {{ acceptLabel() }}
    </button>
    <button type="button" class="datetime-actions__button" (click)="picker.cancel(true)">
      {{ cancelLabel() }}
    </button>
  </div>
</ng-template>
