<fieldset class="seat-stepper">
  <legend class="seat-stepper__legend text-label text-label--strong">
    @if (icon(); as icon) {
      <ion-icon class="seat-stepper__icon" [icon]="icon" aria-hidden="true" />
    }
    {{ label() }}
  </legend>
  <div class="seat-stepper__controls">
    <button
      type="button"
      class="seat-stepper__button"
      [attr.aria-label]="decreaseLabel()"
      [disabled]="!canRemove()"
      (click)="change(-1)"
    >
      <ion-icon [icon]="removeIcon" aria-hidden="true" />
    </button>
    <output class="seat-stepper__value" aria-live="polite">{{ value() }}</output>
    <button
      type="button"
      class="seat-stepper__button"
      [attr.aria-label]="increaseLabel()"
      [disabled]="!canAdd()"
      (click)="change(1)"
    >
      <ion-icon [icon]="addIcon" aria-hidden="true" />
    </button>
  </div>
  @if (hint(); as hint) {
    <p class="seat-stepper__hint text-caption text-color-muted">{{ hint }}</p>
  }
</fieldset>
