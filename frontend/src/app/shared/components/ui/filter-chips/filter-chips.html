<fieldset class="filter-chips" [class.filter-chips--single-line]="isSingleLine()">
  <!-- Oculta, sin la clase de la leyenda visible: su ancho y margen ganarían
       a .visually-hidden -->
  @if (isLegendHidden()) {
    <legend class="visually-hidden">{{ legend() }}</legend>
  } @else {
    <legend class="text-label filter-chips__legend">{{ legend() }}</legend>
  }
  @if (allLabel(); as all) {
    <ion-chip
      button="true"
      [class.filter-chips__chip--selected]="!value()"
      [attr.aria-pressed]="!value()"
      (click)="valueChange.emit(null)"
    >
      {{ all }}
    </ion-chip>
  }
  @for (option of options(); track option.value) {
    <ion-chip
      button="true"
      [class.filter-chips__chip--selected]="value() === option.value"
      [attr.aria-pressed]="value() === option.value"
      (click)="valueChange.emit(option.value)"
    >
      @if (option.tone; as tone) {
        <span [class]="'filter-chips__dot filter-chips__dot--' + tone" aria-hidden="true"></span>
      }
      {{ option.label }}
    </ion-chip>
  }
</fieldset>
