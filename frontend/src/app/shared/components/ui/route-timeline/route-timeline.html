<ol
  class="route-timeline"
  [class.route-timeline--timed]="hasTimes()"
  [attr.aria-label]="timelineAriaLabel()"
>
  @for (stop of stops(); track $index; let isLast = $last) {
    <li class="route-timeline__stop">
      @if (stop.time; as time) {
        <span class="route-timeline__time">{{ time }}</span>
      } @else if (hasTimes()) {
        <span class="route-timeline__time-slot" aria-hidden="true"></span>
      }
      <span class="route-timeline__rail" aria-hidden="true">
        <span
          class="route-timeline__dot"
          [class.route-timeline__dot--end]="isLast && stops().length > 1"
        ></span>
      </span>
      <div class="route-timeline__body">
        <div class="route-timeline__name">{{ stop.name }}</div>
        <div class="text-caption text-color-muted">{{ stop.detail }}</div>
      </div>
    </li>
  }
</ol>
