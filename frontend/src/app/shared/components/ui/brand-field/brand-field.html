<div class="brand-field__control">
  <ion-input
    [appCombobox]="combobox"
    aria-label="Marca del vehículo"
    fill="outline"
    [placeholder]="otherMode() ? 'Escribe la marca' : 'Buscar marca'"
    autocapitalize="words"
    autocomplete="off"
    [value]="query()"
    [disabled]="disabled()"
    (click)="activateSearch()"
    (ionInput)="updateQuery($event.detail.value)"
    (ionBlur)="handleBlur()"
  >
    <ion-icon slot="start" [icon]="searchIcon" aria-hidden="true" />
  </ion-input>

  @if (searchActive() && combobox.isOpen() && !otherMode()) {
    <div
      class="brand-field__dropdown"
      role="listbox"
      [id]="combobox.listId"
      aria-label="Marcas disponibles"
    >
      @for (brand of filteredBrands(); track brand; let index = $index) {
        <button
          class="brand-field__option"
          type="button"
          role="option"
          [id]="combobox.optionId(index)"
          [class.brand-field__option--active]="combobox.activeIndex() === index"
          [attr.aria-selected]="combobox.activeIndex() === index"
          tabindex="-1"
          (mousedown)="$event.preventDefault()"
          (click)="chooseBrand(brand)"
        >
          {{ brand }}
        </button>
      }
    </div>
  }

  @if (otherMode()) {
    <button
      class="brand-field__back"
      type="button"
      [disabled]="disabled()"
      (click)="returnToBrandList()"
    >
      Buscar en la lista
    </button>
  }
</div>
