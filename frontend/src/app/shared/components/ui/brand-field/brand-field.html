<div class="brand-field__control">
  <ion-input
    aria-label="Marca del vehículo"
    fill="outline"
    [placeholder]="otherMode() ? 'Escribe la marca' : 'Buscar marca'"
    autocapitalize="words"
    autocomplete="off"
    [value]="query()"
    [disabled]="disabled()"
    (ionInput)="updateQuery($event.detail.value)"
    (ionBlur)="handleBlur()"
  >
    <ion-icon slot="start" [icon]="searchIcon" aria-hidden="true" />
  </ion-input>

  <datalist [id]="brandListId" aria-label="Marcas disponibles">
    @for (brand of filteredBrands(); track brand) {
      <option [value]="brand"></option>
    }
  </datalist>

  @if (otherMode()) {
    <button
      class="brand-field__back"
      type="button"
      [disabled]="disabled()"
      (click)="returnToBrandList()"
    >
      Buscar en la lista
    </button>
  }
</div>
