<button
  type="button"
  class="prefix-select__trigger"
  [id]="triggerId"
  aria-haspopup="true"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="'common.countryPrefixLabel' | transloco: { prefix: value() }"
  [disabled]="isDisabled()"
>
  <span class="prefix-select__flag fi fi-{{ country() }}" aria-hidden="true"></span>
  <span>{{ value() }}</span>
  <ion-icon class="prefix-select__caret" [icon]="caretIcon" aria-hidden="true" />
</button>

<!-- Hacia abajo, alineado con el botón; se cierra al elegir -->
<ion-popover
  cssClass="phone-prefix-popover"
  side="bottom"
  alignment="start"
  [showBackdrop]="false"
  [trigger]="triggerId"
  [dismissOnSelect]="true"
  (willPresent)="isOpen.set(true)"
  (didDismiss)="isOpen.set(false)"
>
  <ng-template>
    <ion-content>
      <!-- ion-list da role="list"; cada prefijo, un ion-item que se pulsa -->
      <ion-list lines="none" [attr.aria-label]="'common.countryPrefixList' | transloco">
        @for (prefix of prefixes; track prefix) {
          <ion-item
            button
            [detail]="false"
            [class.select-option--selected]="prefix === value()"
            [attr.aria-current]="prefix === value()"
            (click)="handleChoose(prefix)"
          >
            <span
              slot="start"
              class="prefix-select__flag fi fi-{{ getPrefixCountry(prefix) }}"
              aria-hidden="true"
            ></span>
            <ion-label>{{ prefix }}</ion-label>
          </ion-item>
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-popover>
