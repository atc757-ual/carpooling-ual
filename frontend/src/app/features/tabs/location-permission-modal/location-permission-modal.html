<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<div class="location-permission">
  <ion-icon class="location-permission__icon" [icon]="icon" aria-hidden="true" />
  <h2 class="text-subtitle">¿Usamos tu ubicación?</h2>
  <p class="text-body-s text-color-muted">
    Con ella rellenamos de dónde sales al buscar un viaje, y si estás en el campus te proponemos
    volver a casa. Solo la usamos en el momento: no la guardamos ni la compartimos.
  </p>
  <div class="location-permission__actions">
    <!-- En formularios: cada botón envía el suyo (sin click en ion-button) -->
    <form (submit)="$event.preventDefault(); handleAllow()">
      <ion-button type="submit" expand="block" [disabled]="isAsking()">
        Permitir ubicación
      </ion-button>
    </form>
    <form (submit)="$event.preventDefault(); handleLater()">
      <ion-button type="submit" expand="block" fill="clear">Ahora no</ion-button>
    </form>
  </div>
</div>
