<!-- Móvil: el logotipo, la campana (lleva a Avisos) y cerrar sesión. Las
     acciones van en un formulario: el botón de salir lo envía (sin click en
     ion-button) -->
<ion-header class="app-header ion-hide-md-up ion-no-border">
  <ion-toolbar>
    <app-brand-logo slot="start" variant="compact" class="app-header__brand" />
    <form slot="end" (submit)="$event.preventDefault(); handleLogout()">
      <ion-buttons>
        <ion-button class="bell-button" routerLink="/tabs/notifications" aria-label="Avisos">
          <ion-icon slot="icon-only" [icon]="bellIcon" aria-hidden="true" />
        </ion-button>
        <ion-button class="logout-button" type="submit" aria-label="Cerrar sesión">
          <ion-icon slot="icon-only" [icon]="logoutIcon" aria-hidden="true" />
        </ion-button>
      </ion-buttons>
    </form>
  </ion-toolbar>
</ion-header>

<!-- Escritorio: el menú superior y, debajo, la franja fija del saludo -->
<header class="top-nav ion-hide-md-down">
  <app-brand-logo variant="compact" />
  <nav class="top-nav__links" aria-label="Principal">
    @for (tab of tabs(); track tab.path) {
      <a
        class="top-nav__link"
        [routerLink]="'/tabs/' + tab.path"
        routerLinkActive="top-nav__link--active"
        ariaCurrentWhenActive="page"
        >{{ tab.label }}</a
      >
    }
  </nav>
  <div class="top-nav__actions">
    <ion-button
      class="bell-button"
      fill="clear"
      routerLink="/tabs/notifications"
      aria-label="Avisos"
    >
      <ion-icon slot="icon-only" [icon]="bellIcon" aria-hidden="true" />
    </ion-button>
    <form (submit)="$event.preventDefault(); handleLogout()">
      <ion-button class="logout-button" type="submit" fill="clear" aria-label="Cerrar sesión">
        <ion-icon slot="icon-only" [icon]="logoutIcon" aria-hidden="true" />
      </ion-button>
    </form>
  </div>
</header>
<div class="greeting-bar ion-hide-md-down">
  <div class="greeting-bar__content">
    <p class="text-subtitle">¡Hola, {{ firstName() }}!</p>
    <app-mode-selector />
  </div>
</div>

<!-- Solo cambia lo de dentro. La barra de pestañas, solo en el móvil (en
     escritorio está oculta, pero sigue marcando la pestaña activa) -->
<ion-tabs>
  <ion-tab-bar slot="bottom" class="tab-bar ion-hide-md-up">
    @for (tab of tabs(); track tab.path) {
      <ion-tab-button [tab]="tab.path">
        <ion-icon [icon]="tab.icon" aria-hidden="true" />
        <ion-label>{{ tab.label }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
