<!-- La casilla y, marcada, los días de la semana (cada uno con su nombre
     entero para el lector de pantalla), hasta cuándo y cuántos viajes salen -->
<div class="repeat-days">
  <ion-checkbox
    [formControl]="controls().isRepeating"
    labelPlacement="end"
    justify="start"
    (ionChange)="handleRepeat($event.detail.checked)"
  >
    {{ 'publish.repeat.label' | transloco }}
  </ion-checkbox>
  @if (isRepeating()) {
    <p class="text-caption text-color-muted">{{ 'publish.repeat.hint' | transloco }}</p>
    <app-weekday-picker
      [legend]="'publish.repeat.weekdays' | transloco"
      [value]="chosen()"
      (valueChange)="controls().weekdays.setValue($event)"
    />
    <app-datetime-field
      [formControl]="controls().until"
      [label]="'publish.repeat.until' | transloco"
      [min]="minUntil()"
      [max]="maxUntil"
    />
    <!-- Cuántos salen, o qué falta: se lee al cambiar -->
    <p class="text-caption" [class.text-color-muted]="summary()" aria-live="polite">
      {{ summary() ?? ('publish.repeat.noDays' | transloco) }}
    </p>
  }
</div>
