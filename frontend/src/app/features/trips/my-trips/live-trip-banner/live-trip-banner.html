<section class="live-trip-banner" aria-labelledby="live-trip-title">
  <div class="live-trip-banner__text">
    <span id="live-trip-title" class="text-eyebrow live-trip-banner__eyebrow">
      <span class="live-trip-banner__dot" aria-hidden="true"></span>
      {{ 'live.viajeCurso' | transloco }}
    </span>
    <span class="text-body text-body--strong live-trip-banner__route">{{ route() }}</span>
    @if (detail()) {
      <span class="text-body-s live-trip-banner__detail">{{ detail() }}</span>
    }
  </div>
  <!-- El coche (el icono de «En curso»): lleva al viaje y muestra «Abrir
       viaje» al pasar o con el primer toque -->
  <a
    class="icon-btn icon-btn--reveal live-trip-banner__open"
    appRevealOnTouch
    [attr.aria-label]="'live.abrirViajeCurso' | transloco"
    [routerLink]="link()"
  >
    <ion-icon [icon]="liveIcon" aria-hidden="true" />
    <span class="icon-btn__label" aria-hidden="true">{{ 'live.abrirViaje' | transloco }}</span>
  </a>
</section>
