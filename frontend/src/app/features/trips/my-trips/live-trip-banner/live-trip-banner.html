<!-- El aviso entero es el enlace (ion-item, sin flecha): «Viaje en curso», el
     trayecto y el detalle, que son también el nombre del enlace; a la derecha
     el chevron azul, como los demás avisos que se pulsan -->
<ion-item class="live-trip-banner" lines="none" [routerLink]="link()" [detail]="false">
  <ion-label class="live-trip-banner__text">
    <span class="text-eyebrow live-trip-banner__eyebrow">{{ 'live.viajeCurso' | transloco }}</span>
    <!-- En escritorio, en una línea: «Roquetas de Mar → Campus UAL» -->
    <span class="text-body text-body--strong live-trip-banner__route">{{ route() }}</span>
    <!-- En el móvil, el origen y el destino uno debajo del otro, con su icono -->
    <span class="live-trip-banner__ends">
      <span class="live-trip-banner__end text-body text-body--strong">
        <ion-icon [icon]="originIcon" aria-hidden="true" />
        <span class="live-trip-banner__place">{{ ends().origin }}</span>
      </span>
      <span class="live-trip-banner__end text-body text-body--strong">
        <ion-icon [icon]="destinationIcon" aria-hidden="true" />
        <span class="live-trip-banner__place">{{ ends().destination }}</span>
      </span>
    </span>
    @if (detail()) {
      <span class="text-body-s live-trip-banner__detail">{{ detail() }}</span>
    }
  </ion-label>
  <ion-icon slot="end" class="live-trip-banner__chevron" [icon]="chevronIcon" aria-hidden="true" />
</ion-item>
