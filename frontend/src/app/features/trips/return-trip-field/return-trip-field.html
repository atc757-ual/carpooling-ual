<!-- La casilla con su texto como etiqueta y, marcada, la hora de la vuelta -->
<div class="return-trip">
  <ion-checkbox [formControl]="controls().hasReturn" labelPlacement="end" justify="start">
    {{ 'publish.publicarTambienVuelta' | transloco }}
  </ion-checkbox>
  @if (hasReturn()) {
    <p class="text-caption text-color-muted">
      {{ 'publish.otroViajeDesdeCampus' | transloco }}
    </p>
    <app-datetime-field
      [formControl]="controls().returnTime"
      presentation="time"
      [label]="'publish.salidaVuelta' | transloco"
    />
    @if (isTooEarly()) {
      <p class="text-body-s text-color-danger" role="alert">
        {{ 'publish.returnAfterArrival' | transloco: { time: arrivalTime() } }}
      </p>
    }
  }
</div>
