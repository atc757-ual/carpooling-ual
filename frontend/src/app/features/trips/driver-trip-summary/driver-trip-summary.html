<ion-card class="driver-summary role-card role-card--driver">
  <ion-card-content>
    <div class="driver-summary__head">
      <!-- La hora y, a su lado, el papel -->
      <div class="role-card__when">
        <span class="text-subtitle">{{ time() }}</span>
        <span class="role-tag role-tag--driver">
          <ion-icon [icon]="roleIcon" aria-hidden="true" />{{
            trip().status === 'finished' ? 'Condujiste' : 'Conduces'
          }}
        </span>
      </div>
      <span
        class="status"
        [class.status--info]="trip().status === 'published'"
        [class.status--accepted]="trip().status === 'confirmed' || isInProgress()"
        [class.status--danger]="trip().status === 'cancelled'"
      >
        {{ statusLabel() }}
      </span>
    </div>
    <div class="driver-summary__route">{{ route() }}</div>
    <div class="text-caption text-color-muted">{{ seatsLabel() }}</div>
    @if (pendingLabel(); as label) {
      <div class="driver-summary__pending">{{ label }}</div>
    }
    <!-- El enlace cubre toda la tarjeta (::after) -->
    <a
      class="driver-summary__link"
      [routerLink]="link()"
      [attr.aria-label]="action() + ', conduces: ' + when() + ', ' + route()"
      >{{ action() }}</a
    >
  </ion-card-content>
</ion-card>
