@if (activeLink()) {
  <div class="live-share live-share--active">
    <!-- La etiqueta «En directo» con el punto que late y, debajo, qué supone -->
    <output class="live-share__status">
      <span class="live-share__badge text-caption">
        <span class="live-share__dot" aria-hidden="true"></span>
        {{ 'live.directo' | transloco }}
      </span>
      <span class="text-body-s text-color-muted">
        {{ 'live.quienTengaEnlaceViaje' | transloco }}
      </span>
    </output>
    <div class="live-share__actions">
      <ion-button expand="block" [disabled]="isBusy()" (click)="handleResend()">
        <ion-icon slot="start" [icon]="shareIcon" aria-hidden="true" />
        {{ 'live.enviarEnlace' | transloco }}
      </ion-button>
      <ion-button
        class="live-share__stop"
        expand="block"
        fill="outline"
        [disabled]="isBusy()"
        (click)="handleStop()"
      >
        <ion-icon slot="start" [icon]="stopIcon" aria-hidden="true" />
        {{ 'live.dejarCompartir' | transloco }}
      </ion-button>
    </div>
  </div>
} @else {
  <div class="live-share">
    <ion-button expand="block" fill="outline" [disabled]="isBusy()" (click)="handleStart()">
      <ion-icon slot="start" [icon]="liveIcon" aria-hidden="true" />
      {{ 'live.compartirViajeDirecto' | transloco }}
    </ion-button>
    <p class="text-caption text-color-muted">
      {{ 'live.abreSinCuentaVera' | transloco }}
    </p>
  </div>
}
