<!-- Un solo texto con el enlace dentro (como las condiciones del registro): el
     texto va fuera de la etiqueta de la casilla para que pulsar el enlace no
     la marque -->
<div class="declaration-field">
  <ion-checkbox [formControl]="control()" [attr.aria-labelledby]="labelId()" />
  <span [id]="labelId()" class="text-body-s">
    @if (document() === 'vehicle_declaration') {
      Declaro haber leído la
      <button type="button" class="declaration-field__link" (click)="handleRead()">
        declaración del vehículo</button
      >: tiene el seguro obligatorio en vigor y la ITV al día.
    } @else {
      Declaro haber leído la
      <button type="button" class="declaration-field__link" (click)="handleRead()">
        declaración completa
      </button>
      y que tengo el permiso de conducir en vigor.
    }
  </span>
</div>
