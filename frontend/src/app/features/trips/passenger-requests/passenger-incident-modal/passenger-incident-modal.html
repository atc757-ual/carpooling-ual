<form
  class="incident-modal"
  [class.modal-body]="!isInline"
  [class.incident-modal--inline]="isInline"
  (submit)="$event.preventDefault(); handleConfirm()"
>
  <!-- Sin título visible (el botón ya lo dice): solo para el lector de pantalla -->
  <h2 class="visually-hidden">Bajarme y registrar incidencia</h2>

  <output class="notice notice--info incident-modal__note">
    <span>Tu incidencia la revisará un administrador.</span>
  </output>

  <!-- Pastillas en lugar de una lista: ocupan menos alto. Cada una, un radio
       nativo oculto (teclado y lector de pantalla de serie) -->
  <fieldset class="incident-modal__section incident-modal__fieldset">
    <legend class="text-label text-label--strong">Motivo principal</legend>
    <div class="incident-modal__chips">
      @for (cat of categories; track cat.value) {
        <label
          class="incident-modal__chip"
          [class.incident-modal__chip--selected]="selectedCategory() === cat.value"
        >
          <input
            class="visually-hidden"
            type="radio"
            name="incident-category"
            [value]="cat.value"
            [checked]="selectedCategory() === cat.value"
            (change)="selectedCategory.set(cat.value)"
          />
          {{ cat.short }}
        </label>
      }
    </div>
  </fieldset>

  <div class="incident-modal__section">
    <ion-textarea
      class="incident-modal__textarea"
      label="¿Qué ha ocurrido?"
      labelPlacement="stacked"
      fill="outline"
      rows="2"
      [maxlength]="maxLength"
      [counter]="true"
      [value]="description()"
      [helperText]="'Mínimo ' + minLength + ' caracteres. Sé lo más claro posible.'"
      (ionInput)="handleDescriptionInput($event)"
    />

    @if (errorMessage(); as error) {
      <div class="incident-modal__error notice--danger" role="alert">
        <ion-icon [icon]="alertIcon" aria-hidden="true" />
        <p class="text-body-s">{{ error }}</p>
      </div>
    }
  </div>

  <div class="incident-modal__actions">
    <ion-button
      class="incident-modal__btn-submit"
      type="submit"
      expand="block"
      [disabled]="!isFormValid() || isSubmitting()"
    >
      @if (isSubmitting()) {
        <ion-spinner name="crescent" slot="start" aria-hidden="true" />
      }
      Bajarme y registrar incidencia
    </ion-button>

    <ion-button
      class="incident-modal__btn-cancel"
      type="button"
      fill="outline"
      expand="block"
      [disabled]="isSubmitting()"
      (click)="handleCancel()"
    >
      Continuar en el viaje
    </ion-button>
  </div>
</form>
