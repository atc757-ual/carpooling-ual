<form class="vehicle-form" [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate>
  <!-- Cada campo con su etiqueta encima (como la de los asientos), para que
       los de una fila queden a la misma altura. Marca y modelo, en una fila -->
  <div class="vehicle-form__row">
    <div class="vehicle-form__field">
      <label class="text-label text-label--strong" for="vehicle-brand">Marca</label>
      <app-brand-field id="vehicle-brand" formControlName="brand" />
    </div>
    <div class="vehicle-form__field">
      <span class="text-label text-label--strong" aria-hidden="true">Modelo</span>
      <ion-input
        formControlName="model"
        aria-label="Modelo"
        fill="outline"
        placeholder="Ibiza"
        autocapitalize="words"
        errorText="Escribe el modelo, como Ibiza."
      />
    </div>
  </div>
  <!-- Color y motor, a la vista y de un toque (sin desplegables: nada flota
       fuera de la ventana). Botones de opción nativos, con teclado -->
  <fieldset class="vehicle-form__choices">
    <legend class="text-label text-label--strong">Color</legend>
    <div class="vehicle-form__colors">
      @for (color of colors; track color.value) {
        <label class="vehicle-form__color">
          <input type="radio" formControlName="color" [value]="color.value" />
          <span
            class="vehicle-form__swatch"
            [style.--swatch-color]="color.hex"
            aria-hidden="true"
          ></span>
          {{ color.label }}
        </label>
      }
    </div>
  </fieldset>
  <fieldset class="vehicle-form__choices">
    <legend class="text-label text-label--strong">Motor</legend>
    <div class="vehicle-form__engines">
      @for (engine of engines; track engine.value) {
        <label class="vehicle-form__engine">
          <input type="radio" formControlName="engine" [value]="engine.value" />
          <ion-icon [icon]="engine.icon" aria-hidden="true" />
          {{ engine.label }}
        </label>
      }
    </div>
  </fieldset>
  <!-- Matrícula (con su ayuda justo debajo) y asientos, en una fila -->
  <div class="vehicle-form__row">
    <div class="vehicle-form__field">
      <span class="text-label text-label--strong" aria-hidden="true">Matrícula</span>
      <ion-input
        formControlName="plate"
        aria-label="Matrícula"
        fill="outline"
        placeholder="1234 BCD"
        autocapitalize="characters"
        helperText="Matrícula española, como 1234 BCD."
        errorText="Escribe una matrícula española, como 1234 BCD."
      />
    </div>
    <div class="vehicle-form__field">
      <app-seat-stepper
        formControlName="totalSeats"
        label="Asientos"
        [min]="minTotalSeats"
        [max]="maxTotalSeats"
      />
      <p class="field-hint">Asientos totales del vehículo.</p>
    </div>
  </div>
  <!-- Se activa al completar los campos (cada uno dice lo que le falta) -->
  <ion-button type="submit" expand="block" [disabled]="isSaving() || !isComplete()">
    @if (isSaving()) {
      <ion-spinner slot="start" name="crescent" aria-hidden="true" />
    }
    {{ submitLabel() }}
  </ion-button>
</form>
