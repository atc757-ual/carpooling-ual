<ion-card class="live-safety" role="region" aria-labelledby="live-safety-title">
  <ion-card-content>
    <h2 id="live-safety-title" class="text-subtitle">Viaje seguro</h2>
    <!-- Dos filas, cada una con su texto y su botón a la derecha: compartir y
         la emergencia (el SOS rojo llama al 112) -->
    @if (liveShareTripId(); as tripId) {
      <!-- Pasajero: el enlace en directo (la ✕ pide confirmar a la pantalla) -->
      <app-trip-live-share [tripId]="tripId" [isCompact]="true" />
    } @else {
      <div class="live-safety__row">
        <p class="text-body-s text-color-muted">Comparte el viaje con alguien de confianza.</p>
        <button
          type="button"
          class="icon-btn"
          aria-label="Compartir el viaje con alguien de confianza"
          title="Compartir el viaje"
          (click)="handleShare()"
        >
          <ion-icon [icon]="shareIcon" aria-hidden="true" />
        </button>
      </div>
    }
    @if (showEmergency()) {
      <div class="live-safety__row">
        <p class="text-body-s text-color-muted">Si hay una emergencia, llama al 112.</p>
        <!-- 112: el teléfono único de emergencias en Europa -->
        <a
          class="icon-btn icon-btn--danger"
          href="tel:112"
          aria-label="SOS: llamar al 112"
          title="Llamar al 112"
        >
          SOS
        </a>
      </div>
    }
  </ion-card-content>
</ion-card>
