<ion-card class="live-safety" role="region" aria-labelledby="live-safety-title">
  <ion-card-content>
    <div class="section-item">
      <div class="section-item__text">
        <h2 id="live-safety-title" class="section-item__title">Viaje seguro</h2>
        <p class="section-item__subtitle">
          Envía tu viaje a alguien de confianza para que sepa por dónde vas.
        </p>
      </div>
      <button
        type="button"
        class="icon-btn icon-btn--reveal"
        appRevealOnTouch
        aria-label="Compartir el viaje con alguien de confianza"
        (click)="handleShare()"
      >
        <ion-icon [icon]="shareIcon" aria-hidden="true" />
        <span class="icon-btn__label" aria-hidden="true">Compartir viaje</span>
      </button>
    </div>
  </ion-card-content>
</ion-card>
