<ion-card class="live-safety" role="region" aria-labelledby="live-safety-title">
  <ion-card-content>
    <h2 id="live-safety-title" class="text-subtitle">Viaje seguro</h2>
    <!-- Conductor y pasajero: el texto y, a la derecha, compartir el viaje
         (el menú del sistema; muestra su texto al pasar o con el primer toque) -->
    <div class="live-safety__row">
      <p class="text-body-s text-color-muted">Envía tu viaje a alguien de confianza.</p>
      <button
        type="button"
        class="icon-btn icon-btn--reveal"
        appRevealOnTouch
        aria-label="Compartir el viaje con alguien de confianza"
        (click)="handleShare()"
      >
        <ion-icon [icon]="shareIcon" aria-hidden="true" />
        <span class="icon-btn__label" aria-hidden="true">Compartir viaje</span>
      </button>
    </div>
  </ion-card-content>
</ion-card>
