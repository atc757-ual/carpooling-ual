@if (isInline()) {
  <!-- Conductor: compartir y SOS como iconos junto a «Terminar viaje»; con
       ratón muestran su texto al pasar y en el móvil con el primer toque -->
  <div class="live-safety-inline">
    <button
      type="button"
      class="icon-btn icon-btn--reveal"
      appRevealOnTouch
      aria-label="Compartir el viaje con alguien de confianza"
      (click)="handleShare()"
    >
      <ion-icon [icon]="shareIcon" aria-hidden="true" />
      <span class="icon-btn__label" aria-hidden="true">Compartir</span>
    </button>
    <!-- 112: el teléfono único de emergencias en Europa -->
    <a
      class="icon-btn icon-btn--reveal icon-btn--danger"
      appRevealOnTouch
      href="tel:112"
      aria-label="SOS: llamar al 112"
    >
      <ion-icon [icon]="callIcon" aria-hidden="true" />
      <span class="icon-btn__label" aria-hidden="true">SOS 112</span>
    </a>
  </div>
} @else {
  <ion-card class="live-safety" role="region" aria-labelledby="live-safety-title">
    <ion-card-content>
      <h2 id="live-safety-title" class="text-subtitle">Viaje seguro</h2>
      <!-- Pasajero: el enlace en directo con alguien de confianza (el SOS va en
           la esquina de las pastillas de la hoja) -->
      @if (liveShareTripId(); as tripId) {
        <app-trip-live-share [tripId]="tripId" [isCompact]="true" />
      }
    </ion-card-content>
  </ion-card>
}
