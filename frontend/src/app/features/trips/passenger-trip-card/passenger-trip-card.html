<!-- Toda la tarjeta es un enlace (ion-card [routerLink]) a la solicitud -->
<ion-card
  class="passenger-trip role-card role-card--passenger"
  [routerLink]="['/tabs/trips/requests', item().request.id]"
  [attr.aria-label]="linkLabel()"
>
  <ion-card-content>
    <div class="passenger-trip__head">
      <!-- La hora y, a su lado, el papel -->
      <div class="role-card__when">
        <span class="text-subtitle">{{ time() }}</span>
        <span class="role-tag role-tag--passenger">
          <ion-icon [icon]="roleIcon" aria-hidden="true" />{{ roleLabel() }}
        </span>
      </div>
      <span
        class="status"
        [class.status--pending]="isPending()"
        [class.status--accepted]="isAccepted()"
        [class.status--danger]="tab() === 'cancelled'"
      >
        {{ statusLabel() }}
      </span>
    </div>
    @if (way(); as tripWay) {
      <div class="trip-way">
        <ion-icon [icon]="tripWay.icon" aria-hidden="true" />{{ tripWay.label }}
      </div>
    }
    <div class="passenger-trip__route">{{ route() }}</div>
    @if (nextStep(); as step) {
      <div class="passenger-trip__next">{{ step }}</div>
    }
    <div class="text-caption text-color-muted">{{ details() }}</div>
  </ion-card-content>
</ion-card>
