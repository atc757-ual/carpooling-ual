<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ vehicle ? 'Editar vehículo' : 'Registrar vehículo' }}</ion-title>
    <ion-buttons slot="end">
      <!-- En un formulario: el botón lo envía (sin click en ion-button) -->
      <form (submit)="$event.preventDefault(); close()">
        <ion-button class="dialog-close" type="submit" aria-label="Cerrar">
          <ion-icon slot="icon-only" [icon]="closeIcon" aria-hidden="true" />
        </ion-button>
      </form>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<div class="vehicle-modal">
  <app-vehicle-form
    [vehicle]="vehicle"
    [submitLabel]="vehicle ? 'Guardar cambios' : 'Registrar vehículo'"
    (saved)="handleSaved($event)"
  />
  @if (vehicle; as current) {
    <!-- Solo se cambian los asientos: si el resto está mal, se elimina -->
    <div class="vehicle-modal__remove">
      <p class="text-body-s text-color-muted">
        ¿Algún dato mal? Elimina el vehículo y regístralo de nuevo.
      </p>
      <form (submit)="$event.preventDefault(); handleRemove(current)">
        <ion-button type="submit" fill="clear" color="danger" size="small">
          <ion-icon slot="start" [icon]="removeIcon" aria-hidden="true" />
          Eliminar vehículo
        </ion-button>
      </form>
    </div>
  }
</div>
