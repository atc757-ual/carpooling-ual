<!-- Leyendo la declaración (un paso dentro de esta ventana) no hay ✕: se sale
     con sus botones -->
<app-modal-header
  [title]="vehicle ? 'Editar vehículo' : 'Registrar vehículo'"
  [hasClose]="!form()?.isReadingDeclaration()"
  (closed)="close()"
/>

<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<div class="modal-body vehicle-modal">
  <app-vehicle-form
    [vehicle]="vehicle"
    [submitLabel]="vehicle ? 'Guardar cambios' : 'Registrar vehículo'"
    (saved)="handleSaved($event)"
  />
</div>
