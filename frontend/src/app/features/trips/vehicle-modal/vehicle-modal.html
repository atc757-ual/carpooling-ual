<app-modal-header [title]="vehicle ? 'Editar vehículo' : 'Registrar vehículo'" (closed)="close()" />

<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<div class="modal-body vehicle-modal">
  <app-vehicle-form
    [vehicle]="vehicle"
    [submitLabel]="vehicle ? 'Guardar cambios' : 'Registrar vehículo'"
    (saved)="handleSaved($event)"
  />
</div>
