<div class="round-trip-seats">
  <ion-checkbox
    labelPlacement="end"
    justify="start"
    [checked]="isSame()"
    (ionChange)="handleSameChange($event.detail.checked)"
  >
    {{ 'publish.mismoNumeroPlazasIda' | transloco }}
  </ion-checkbox>
  @if (isSame()) {
    <app-seat-stepper
      [formControl]="seats()"
      [label]="'publish.plazasIdaVuelta' | transloco"
      [max]="max()"
    />
  } @else {
    <!-- Lado a lado también en el móvil: cada uno cabe en la mitad -->
    <div class="round-trip-seats__pair">
      <app-seat-stepper
        [formControl]="seats()"
        [label]="'publish.ida' | transloco"
        [icon]="toCampusIcon"
        [max]="max()"
      />
      <app-seat-stepper
        [formControl]="returnSeats()"
        [label]="'publish.vuelta' | transloco"
        [icon]="fromCampusIcon"
        [max]="max()"
      />
    </div>
  }
</div>
