<ion-content>
  <!-- Solo en el móvil: el modo y el saludo, sobre blanco (en escritorio están
       en la franja fija de arriba) -->
  <section class="home__greeting ion-hide-md-up">
    <app-mode-selector variant="card" />
    <h1 class="text-title">¡Hola, {{ firstName() }}!</h1>
  </section>

  <section class="tab-page">
    <h1 class="text-title ion-hide-md-down">Inicio</h1>
    @if (hasMode()) {
      <p class="text-body text-color-muted">
        Muy pronto podrás buscar y publicar viajes desde aquí.
      </p>
    } @else {
      <p class="text-body text-color-muted">
        Antes de empezar, elige si viajarás como pasajero, como conductor o de las dos formas.
      </p>
      <ion-button expand="block" [routerLink]="modesPath">Elegir modo</ion-button>
    }
  </section>
</ion-content>
