<ion-content>
  <section class="tab-page">
    <!-- En escritorio, el saludo y el modo ya están en la franja fija -->
    <app-mode-selector variant="card" class="ion-hide-md-up" />
    <h1 class="text-title">
      <span class="ion-hide-md-up">Hola, {{ firstName() }}</span>
      <span class="ion-hide-md-down">Inicio</span>
    </h1>
    @if (hasMode()) {
      <p class="text-body text-color-muted">
        Muy pronto podrás buscar y publicar viajes desde aquí.
      </p>
    } @else {
      <p class="text-body text-color-muted">
        Antes de empezar, elige si viajarás como pasajero, como conductor o de las dos formas.
      </p>
      <ion-button expand="block" [routerLink]="modesPath">Elegir modo</ion-button>
    }
  </section>
</ion-content>
