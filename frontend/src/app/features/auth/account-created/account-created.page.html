<ion-content>
  <app-auth-layout>
    <!-- Sin botón de volver: la cuenta ya existe y la sesión está abierta -->
    <div class="auth-intro">
      <span class="auth-icon auth-icon--success" aria-hidden="true">
        <ion-icon [icon]="checkIcon" />
      </span>
      <h1 class="text-heading">{{ title() }}</h1>
      <p class="text-body text-color-muted">{{ description() }}</p>
    </div>

    <!-- Entrar (enlace, siempre a Buscar) o salir y dejarlo para luego. El botón
         de salir es type="submit": ni (click) en un ion-button ni un botón suelto -->
    <form class="account-created__actions" (submit)="$event.preventDefault(); handleLater()">
      <ion-button expand="block" [routerLink]="searchPath">Entrar a la app</ion-button>
      <ion-button type="submit" expand="block" fill="outline" [disabled]="isLeaving()">
        Entrar más tarde
      </ion-button>
    </form>

    <p class="account-created__note text-caption text-color-muted">
      Si prefieres dejarlo para luego, entra cuando quieras con tu correo de la UAL y tu contraseña.
    </p>
  </app-auth-layout>
</ion-content>
