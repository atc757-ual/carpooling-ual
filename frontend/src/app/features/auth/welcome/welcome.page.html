<ion-content>
  <!-- En el móvil, el layout pone el logotipo y la ilustración encima y el
       pie de confianza debajo -->
  <app-auth-layout variant="welcome">
    <div class="welcome__intro">
      <h1 class="text-heading">{{ 'auth.welcome.title' | transloco }}</h1>
      <p class="text-body text-color-muted">
        {{ 'auth.welcome.subtitle' | transloco }}
      </p>
    </div>
    <div class="welcome__actions">
      <ion-button expand="block" routerLink="/auth/register">
        {{ 'auth.welcome.createAccount' | transloco }}
      </ion-button>
      <ion-button expand="block" fill="outline" routerLink="/auth/login">{{
        'auth.welcome.alreadyHaveAccount' | transloco
      }}</ion-button>
    </div>
  </app-auth-layout>
</ion-content>
