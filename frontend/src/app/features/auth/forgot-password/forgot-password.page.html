<!-- Solo en el móvil: la barra con la vuelta al login y el título -->
<ion-header class="ion-hide-md-up ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button
        class="back-button"
        fill="clear"
        routerLink="/auth/login"
        routerDirection="back"
        aria-label="Volver"
      >
        <ion-icon slot="icon-only" [icon]="backIcon" aria-hidden="true" />
      </ion-button>
    </ion-buttons>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-auth-layout>
    <!-- En escritorio, sin barra: la flecha y el título sobre el logotipo -->
    <div class="top-bar ion-hide-md-down" authLayoutTop>
      <ion-button
        class="back-button"
        fill="clear"
        routerLink="/auth/login"
        routerDirection="back"
        aria-label="Volver"
      >
        <ion-icon slot="icon-only" [icon]="backIcon" aria-hidden="true" />
      </ion-button>
      <span class="top-bar__title">Recuperar contraseña</span>
    </div>

    <div class="auth-intro">
      <span class="auth-icon" aria-hidden="true">
        <ion-icon [icon]="mailIcon" />
      </span>
      <h1 class="text-heading">Volver a entrar, sin complicaciones.</h1>
      <p class="text-body text-color-muted">
        Introduce tu correo UAL y te enviaremos un código para cambiar la contraseña.
      </p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate>
      <div class="auth-field">
        <span class="text-label text-label--strong" aria-hidden="true">Correo UAL</span>
        <ion-input
          formControlName="email"
          [appCombobox]="emailSuggestions.combobox"
          type="email"
          inputmode="email"
          autocomplete="email"
          aria-label="Correo UAL"
          fill="outline"
          placeholder="nombre@inlumine.ual.es"
          [errorText]="emailErrorText()"
        >
          <ion-icon slot="start" [icon]="mailIcon" aria-hidden="true" />
        </ion-input>
        <app-email-suggestions #emailSuggestions [control]="form.controls.email" />
      </div>

      <ion-button type="submit" expand="block" [disabled]="form.invalid || isSubmitting()">
        @if (isSubmitting()) {
          <ion-spinner name="crescent" aria-label="Enviando" />
        } @else {
          Enviar código
        }
      </ion-button>
    </form>

    <hr class="auth-divider" />

    <ion-button
      class="forgot-password__login"
      expand="block"
      fill="outline"
      routerLink="/auth/login"
      routerDirection="back"
    >
      Volver a iniciar sesión
    </ion-button>
  </app-auth-layout>
</ion-content>
