<!-- «Tus reseñas · Conductor»: cada fila de Mi perfil abre la de su papel -->
<app-modal-header [title]="title()" [closeLabel]="'common.close' | transloco" (closed)="close()" />

<!-- Tan alta como su contenido, con tope (list-dialog), y se desplaza dentro,
     como los comentarios de las redes sociales: el resumen arriba, la lista
     debajo y «Desliza para ver más» mientras queda lista por debajo -->
<div class="modal-body profile-reviews" appScrollHint #hint="scrollHint">
  @if (errorMessage(); as message) {
    <div class="notice notice--danger" role="alert">
      <span>{{ message }}</span>
    </div>
  }

  <!-- La media y cuántas hay de cada nota en este papel -->
  @if (summary(); as summary) {
    <app-rating-summary [rating]="summary" />
  }

  @if (items().length > 0) {
    <app-review-list
      [items]="items()"
      [total]="total()"
      [isLoading]="isLoading()"
      [label]="title()"
      (reachedEnd)="loadMoreIfAny()"
    />
  } @else if (isLoading()) {
    <output class="profile-reviews__loading">
      <ion-spinner name="crescent" [attr.aria-label]="'driverReviews.loading' | transloco" />
    </output>
  } @else if (!errorMessage()) {
    <p class="text-body text-color-muted profile-reviews__empty">
      {{ 'profile.reviewsModal.empty' | transloco }}
    </p>
  }

  <app-scroll-hint [target]="hint" />
</div>
