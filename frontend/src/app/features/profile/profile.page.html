<ion-content>
  <div class="tab-page profile">
    <h1 class="visually-hidden">Perfil</h1>

    <div class="profile__layout">
      <div class="profile__main">
        @if (user(); as user) {
          <ion-card>
            <ion-card-content class="profile__account">
              <span class="profile__avatar" aria-hidden="true">{{ initials() }}</span>
              <span class="profile__identity">
                <span class="text-subtitle">{{ user.name }}</span>
                <span class="text-body-s text-color-muted">{{ user.email }}</span>
                @if (phone(); as phone) {
                  <span class="text-body-s text-color-muted">{{ phone }}</span>
                }
              </span>
            </ion-card-content>
          </ion-card>
        }
        <app-profile-modes />
      </div>

      <div class="profile__aside">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Privacidad</ion-card-title>
          </ion-card-header>
          <ion-card-content class="profile__links">
            <form (submit)="$event.preventDefault(); handleOpenLegal('terms')">
              <ion-button type="submit" fill="clear" size="small">Condiciones de uso</ion-button>
            </form>
            <form (submit)="$event.preventDefault(); handleOpenLegal('privacy')">
              <ion-button type="submit" fill="clear" size="small">
                Política de privacidad
              </ion-button>
            </form>
          </ion-card-content>
        </ion-card>
        <!-- En un formulario: el botón lo envía (sin click en ion-button) -->
        <form (submit)="$event.preventDefault(); handleLogout()">
          <ion-button type="submit" fill="outline" color="danger" expand="block">
            Cerrar sesión
          </ion-button>
        </form>
      </div>
    </div>
  </div>
</ion-content>
