<h2 id="help-audience-legend" class="audience-picker__legend text-card-title">
  {{ 'help.audience.legend' | transloco }}
</h2>
<!-- ion-segment: se elige con el ratón, el dedo o las flechas del teclado -->
<ion-segment
  class="audience-picker"
  aria-labelledby="help-audience-legend"
  [value]="audience()"
  (ionChange)="handleChange($event.detail.value)"
>
  @for (option of options; track option.value) {
    <ion-segment-button class="audience-picker__option" layout="icon-start" [value]="option.value">
      <ion-icon class="audience-picker__icon" [icon]="option.icon" aria-hidden="true" />
      <ion-label class="audience-picker__text">
        <span class="audience-picker__name">{{
          'help.audience.' + option.value + '.name' | transloco
        }}</span>
        <span class="audience-picker__hint">{{
          'help.audience.' + option.value + '.hint' | transloco
        }}</span>
      </ion-label>
    </ion-segment-button>
  }
</ion-segment>
