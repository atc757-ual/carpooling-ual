<ion-card>
  <ion-card-header>
    <ion-card-title>Mis perfiles</ion-card-title>
  </ion-card-header>
  <ion-card-content class="profile-modes">
    <ul class="profile-modes__list">
      @for (row of rows(); track row.profile) {
        <li class="profile-mode">
          <ion-icon [icon]="row.icon" aria-hidden="true" />
          <span class="profile-mode__body">
            <span class="profile-mode__label">{{ row.label }}</span>
            <span class="text-caption text-color-muted">{{ row.description }}</span>
          </span>
          @if (row.isActive) {
            <span class="status status--accepted">Activo</span>
          } @else {
            <form (submit)="$event.preventDefault(); handleActivate(row.profile)">
              <ion-button
                type="submit"
                size="small"
                fill="outline"
                [disabled]="activating() !== null"
                [attr.aria-label]="'Activar perfil de ' + row.label.toLowerCase()"
              >
                Activar
              </ion-button>
            </form>
          }
        </li>
      }
    </ul>
    @if (hasBoth()) {
      <p class="text-caption text-color-muted">
        Con los dos, eliges con cuál viajas en Inicio («¿Cómo viajas hoy?»).
      </p>
    }
  </ion-card-content>
</ion-card>
