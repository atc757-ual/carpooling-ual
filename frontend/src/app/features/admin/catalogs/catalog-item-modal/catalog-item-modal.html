<!-- Sin ion-content: así la ventana toma el alto de su contenido -->
<form class="modal-body confirm catalog-item" (submit)="$event.preventDefault(); handleConfirm()">
  <h2 class="text-subtitle">{{ header }}</h2>

  @for (field of textFields(); track field) {
    <div class="catalog-item__field">
      <ion-input
        [label]="labels[field]"
        labelPlacement="stacked"
        fill="outline"
        [maxlength]="isColor(field) ? 7 : maxLength"
        [placeholder]="isColor(field) ? '#2673c9' : ''"
        [value]="values()[field] ?? ''"
        (ionInput)="handleInput(field, $event.detail.value)"
      />
      @if (isColor(field)) {
        <!-- La muestra del tono escrito (decorativa: el valor ya está en el campo) -->
        <span
          class="catalog-item__swatch"
          [style.background]="values()[field] ?? 'transparent'"
          aria-hidden="true"
        ></span>
      }
    </div>
  }

  @if (fields.includes('location')) {
    <div class="catalog-item__point">
      <span class="text-body-s">
        {{ labels.location }}: <b>{{ pointLabel() }}</b>
      </span>
      <ion-button type="button" fill="outline" size="small" (click)="handlePickPoint()">
        Elegir en el mapa
      </ion-button>
    </div>
  }

  @if (withImage) {
    <!-- Toda la zona abre el selector; el input sigue accesible con el teclado -->
    <label class="catalog-item__upload">
      <input
        class="visually-hidden"
        type="file"
        accept="image/png,image/webp"
        (change)="handleImage($event)"
      />
      @if (imagePreview(); as preview) {
        <img class="catalog-item__preview" [src]="preview" alt="" />
      } @else {
        <span class="catalog-item__placeholder" aria-hidden="true">
          <ion-icon [icon]="uploadIcon" />
        </span>
      }
      <span class="catalog-item__upload-text">
        <span class="text-body catalog-item__upload-title">
          {{ image()?.name ?? 'Elegir imagen' }}
        </span>
        <span class="text-body-s catalog-item__upload-hint">
          PNG o WebP, cuadrada, de 128 a 512 px y hasta 100 KB.
        </span>
      </span>
    </label>
  }

  @if (errorMessage(); as error) {
    <p class="catalog-item__error text-body-s" role="alert">{{ error }}</p>
  }

  <div class="confirm__actions">
    <ion-button type="submit" expand="block" [disabled]="!isValid() || isSaving()">
      {{ confirmText }}
    </ion-button>
    <ion-button type="button" expand="block" fill="outline" (click)="handleCancel()">
      Cancelar
    </ion-button>
  </div>
</form>
