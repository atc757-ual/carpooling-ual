<ion-card class="search-faq">
  <ion-card-header>
    <ion-card-title>Preguntas frecuentes</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-accordion-group>
      @for (faq of faqs; track faq.question; let index = $index) {
        <ion-accordion [value]="'faq-' + index">
          <ion-item slot="header" lines="full">
            <ion-label class="search-faq__question">{{ faq.question }}</ion-label>
          </ion-item>
          <p slot="content" class="search-faq__answer text-body-s text-color-muted">
            {{ faq.answer }}
          </p>
        </ion-accordion>
      }
    </ion-accordion-group>
  </ion-card-content>
</ion-card>
