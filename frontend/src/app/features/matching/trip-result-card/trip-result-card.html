<ion-card class="trip-card">
  <ion-card-content>
    <div class="trip-card__head">
      <div class="trip-card__times">{{ trip().departureTime }} → {{ trip().arrivalTime }}</div>
      @if (isLastSeat()) {
        <span class="trip-card__seats trip-card__seats--last">Última plaza</span>
      } @else {
        <span class="trip-card__seats">{{ trip().freeSeats }} plazas</span>
      }
    </div>

    <div class="trip-card__route">{{ trip().origin }} → {{ trip().destination }}</div>

    <app-trip-driver [driver]="trip().driver" />

    <div class="text-caption text-color-muted">
      Desvío de recogida: {{ trip().pickupDetourMinutes }} min
    </div>

    <ion-button expand="block" [routerLink]="['/tabs/search/trips', trip().id]">
      Ver viaje de {{ driverFirstName() }}
    </ion-button>
  </ion-card-content>
</ion-card>
