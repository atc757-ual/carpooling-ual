<ion-content>
  <!-- Móvil: el título, dentro del contenido para que se desplace con él -->
  <app-section-heading />
  <div class="trip-search">
    <!-- La columna de 8: arriba, fuera de la tarjeta, los avisos de la
         pantalla (el viaje en curso o el próximo y las solicitudes que esperan
         respuesta); debajo, la búsqueda -->
    <div class="trip-search__main">
      <app-next-trip-card class="trip-search__next-trip" />

      <!-- El aviso entero lleva a la solicitud (o a Tus viajes, si hay varias). En
           ámbar, como la etiqueta «Pendiente»: esperan respuesta -->
      @if (pendingRequests(); as pending) {
        <a class="trip-search__pending notice notice--warning" [routerLink]="pendingLink()">
          <ion-icon [icon]="pendingIcon" aria-hidden="true" />
          <span class="trip-search__pending-text">
            {{
              (pending === 1 ? 'search.pending.one' : 'search.pending.other')
                | transloco: { count: pending }
            }}
          </span>
          <ion-icon class="trip-search__pending-chevron" [icon]="chevronIcon" aria-hidden="true" />
        </a>
      }

      <!-- La búsqueda, en una tarjeta siempre desplegada (rellena con la
           última, que se cambia ahí mismo). El título de la pantalla va en la
           franja fija -->
      <ion-card class="trip-search__criteria">
        <ion-card-content>
          <app-trip-search-form [showNewSearch]="true" />
        </ion-card-content>
      </ion-card>
    </div>

    <!-- Al lado de la búsqueda en escritorio, al final en el móvil: «Mi
         trayecto habitual» (buscarlo de un toque o guardar esta búsqueda), la
         invitación a publicar (solo sin coche registrado) y las preguntas
         frecuentes -->
    <aside class="trip-search__aside">
      <app-usual-trip-card />
      @if (isCarInviteVisible()) {
        <ion-card class="trip-search__car">
          <ion-item button detail routerLink="/tabs/publish" lines="none">
            <ion-icon slot="start" [icon]="carIcon" aria-hidden="true" />
            <ion-label>
              <span class="trip-search__car-title">{{ 'search.carTitle' | transloco }}</span>
              <p>{{ 'search.carText' | transloco }}</p>
            </ion-label>
          </ion-item>
        </ion-card>
      }
      <app-quick-faqs context="search" />
    </aside>
  </div>
</ion-content>
