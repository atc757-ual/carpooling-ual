<span class="trip-driver__avatar" aria-hidden="true">
  @if (avatarSvg.value(); as avatar) {
    <app-avatar-art class="trip-driver__avatar-art" [graphic]="avatar" />
  } @else {
    {{ initials() }}
  }
</span>
<div class="trip-driver__person">
  <div class="trip-driver__head">
    @if (profileTripId(); as tripId) {
      <app-participant-link
        class="trip-driver__name"
        participantRole="driver"
        [tripId]="tripId"
        [userId]="driver().id ?? ''"
        [name]="driver().name"
        >{{ driver().name }}</app-participant-link
      >
    } @else {
      <span class="trip-driver__name">{{ driver().name }}</span>
    }
    @if (showRating() && rating(); as rating) {
      @if (driver().id) {
        <button
          class="trip-driver__rating trip-driver__rating--button"
          type="button"
          [attr.aria-label]="'request.ratingLabel' | transloco: { rating }"
          (click)="openReviews()"
        >
          <ion-icon class="trip-driver__medal" [icon]="medalIcon" aria-hidden="true" />
          <span>{{ rating }}</span>
        </button>
      } @else {
        <span
          class="trip-driver__rating"
          [attr.aria-label]="'driverReviews.ratingAria' | transloco: { rating }"
        >
          <ion-icon class="trip-driver__medal" [icon]="medalIcon" aria-hidden="true" />
          <span>{{ rating }}</span>
        </span>
      }
    }
  </div>
  <div class="trip-driver__details">{{ details() }}</div>
</div>
