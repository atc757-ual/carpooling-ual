<span class="trip-driver__avatar" aria-hidden="true">
  @if (avatarSvg.value(); as avatar) {
    <app-avatar-art class="trip-driver__avatar-art" [graphic]="avatar" />
  } @else {
    {{ initials() }}
  }
</span>
<div class="trip-driver__person">
  <div class="trip-driver__name">{{ driver().name }}</div>
  <div class="text-caption text-color-muted">{{ details() }}</div>
</div>
@if (rating(); as rating) {
  @if (driver().id) {
    <button
      class="trip-driver__rating trip-driver__rating--button"
      type="button"
      [attr.aria-label]="'Valoración ' + rating + ' de 5. Ver valoraciones'"
      (click)="openReviews()"
    >
      ★ {{ rating }}
    </button>
  } @else {
    <span class="trip-driver__rating" [attr.aria-label]="'Valoración ' + rating + ' de 5'">
      ★ {{ rating }}
    </span>
  }
}
