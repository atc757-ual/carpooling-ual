<form class="search-form" [formGroup]="form" (ngSubmit)="handleSubmit()" novalidate>
  <!-- Lo que se ahorra en este trayecto dejando el coche en casa (estimación
       de ejemplo, con la dirección y el parking elegidos; antes, qué se verá) -->
  <div class="notice notice--success notice--impact search-form__impact" aria-live="polite">
    <ion-icon [icon]="impactIcon" aria-hidden="true" />
    @if (impact(); as impact) {
      <p
        [innerHTML]="
          'search.impact' | transloco: { km: impact.km, co2: formatDecimal(impact.co2Kg) }
        "
      ></p>
      <app-co2-source onBorder />
    } @else {
      <p>{{ 'search.impactHint' | transloco }}</p>
    }
  </div>

  <!-- Trayecto: una dirección y un parking del campus (RouteFields) -->
  <app-route-fields [controls]="form.controls" [showLabel]="false" />

  <!-- Fecha, hora, margen y plazas: de dos en dos y, en pantallas
       anchas, los cuatro en una fila -->
  <div class="search-form__details">
    <app-datetime-field
      formControlName="date"
      [label]="'search.date' | transloco"
      [min]="minDate"
      [max]="maxDate"
    />

    <!-- Hora de llegada al campus o, al volver, de salida -->
    <app-datetime-field
      formControlName="time"
      presentation="time"
      [label]="
        (timeType() === 'arrival' ? 'search.arrivalTime' : 'search.departureTime') | transloco
      "
    />

    <div class="search-form__field">
      <span class="text-label text-label--strong" aria-hidden="true">{{
        'search.margin' | transloco
      }}</span>
      <ion-select
        class="search-form__select"
        formControlName="margin"
        interface="popover"
        fill="outline"
        [attr.aria-label]="'search.margin' | transloco"
      >
        @for (margin of margins; track margin) {
          <ion-select-option [value]="margin">± {{ margin }} min</ion-select-option>
        }
      </ion-select>
    </div>

    <!-- Plazas que se necesitan (SeatStepper de la guía) -->
    <app-seat-stepper
      formControlName="seats"
      [label]="'search.seats' | transloco"
      [min]="minSeats"
      [max]="maxSeats"
    />
  </div>

  <!-- «Nueva búsqueda» (solo en Buscar y con algo que borrar) a la izquierda
       y «Buscar viaje» a la derecha; en el móvil, uno debajo del otro -->
  <div class="search-form__actions">
    @if (canStartOver()) {
      <button class="search-form__new" type="button" (click)="clear()">
        {{ 'search.newSearch' | transloco }}
      </button>
    }
    <!-- Se activa al elegir la dirección y el parking -->
    <ion-button type="submit" [disabled]="!isRouteComplete()">
      <ion-icon slot="start" [icon]="searchIcon" aria-hidden="true" />
      {{ 'search.submit' | transloco }}
    </ion-button>
  </div>
</form>
