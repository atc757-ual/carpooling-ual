# Identificación del proyecto en SonarCloud
sonar.projectKey=atc757-ual_carpooling-ual
sonar.organization=atc757-ual
sonar.projectName=Carpooling UAL
sonar.sourceEncoding=UTF-8

# Código a analizar. Añadir aquí frontend/src y los servicios cuando existan
sonar.sources=backend/src
sonar.tests=backend/src,backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Cobertura generada por Jest (npm run test:cov). Añadir la del frontend cuando exista
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# Igual que en Jest: arranque y scripts de la CLI no se cuentan en la cobertura
sonar.coverage.exclusions=backend/src/main.ts,backend/src/database/**
