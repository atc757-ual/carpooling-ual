# Identificación del proyecto en SonarCloud
sonar.projectKey=atc757-ual_carpooling-ual
sonar.organization=atc757-ual
sonar.projectName=Carpooling UAL
sonar.sourceEncoding=UTF-8

# Código a analizar. Añadir aquí los servicios cuando existan
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,backend/test,frontend/src,frontend/cypress
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,frontend/cypress/**/*.ts
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Cobertura: Jest en el backend y Vitest en el frontend (npm run test:cov)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/carpooling-ual-frontend/lcov.info
# Arranque, configuración por entorno y scripts de la CLI no se cuentan en la
# cobertura
sonar.coverage.exclusions=backend/src/main.ts,backend/src/database/**,frontend/src/main.ts,frontend/src/environments/**

# Decisión de UX: el viewport bloquea el zoom para una experiencia de app
# nativa (configuración por defecto de Ionic). Justificado en la memoria
# frente a WCAG 1.4.4. La regla sigue activa en cualquier otro HTML
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S7926
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/index.html

# Datos de prueba: los ids fijos (UUID) se repiten porque relacionan las filas
# (usuario, perfil, vehículo, viaje); son datos, no constantes mágicas. La regla
# sigue activa en el resto del código
sonar.issue.ignore.multicriteria.e2.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/src/database/seeds/**
