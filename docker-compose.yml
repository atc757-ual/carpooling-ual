services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: carpooling-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpooling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpooling_dev}
      POSTGRES_DB: ${POSTGRES_DB:-carpooling}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Desde PostgreSQL 18 los datos van en /var/lib/postgresql/<versión>
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Motor de rutas OSRM (DP-02, RNF-16) con el mapa de Andalucía de
  # OpenStreetMap. Necesita el mapa ya preparado (scripts/osrm-prepare.sh), por
  # eso va en el perfil "routing": docker compose --profile routing up -d
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.10.0-debian
    container_name: carpooling-osrm
    restart: unless-stopped
    profiles: [routing]
    command: osrm-routed --algorithm mld /data/andalucia-latest.osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./osrm-data:/data:ro

  # Buzón de pruebas para desarrollo: captura todos los correos que envía el
  # backend (códigos de verificación) y los muestra en http://localhost:8025.
  # Ningún correo sale a Internet. No se despliega: en producción se usa un
  # servidor SMTP real (docs/despliegue.md)
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: carpooling-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Observabilidad (perfil "observabilidad"): Alloy lee el log JSON del backend
  # (LOG_FORMAT=json, guardado en logs/), Loki lo almacena 7 días y Grafana
  # muestra el panel de peticiones, errores y p95 por ruta en
  # http://localhost:3001. docker compose --profile observabilidad up -d
  loki:
    image: grafana/loki:3.7.9
    container_name: carpooling-loki
    restart: unless-stopped
    profiles: [observabilidad]
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.21.0
    container_name: carpooling-alloy
    restart: unless-stopped
    profiles: [observabilidad]
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/carpooling:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.4
    container_name: carpooling-grafana
    restart: unless-stopped
    profiles: [observabilidad]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    # Solo desde este equipo: en un servidor se llega por Nginx o por un túnel
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  postgres_data:
  loki_data:
  alloy_data:
  grafana_data:
