services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: carpooling-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpooling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpooling_dev}
      POSTGRES_DB: ${POSTGRES_DB:-carpooling}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Desde PostgreSQL 18 los datos van en /var/lib/postgresql/<versión>
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
