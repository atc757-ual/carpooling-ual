version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: carpooling-db
    environment:
      POSTGRES_USER: carpooling
      POSTGRES_PASSWORD: carpooling_dev
      POSTGRES_DB: carpooling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpooling"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: