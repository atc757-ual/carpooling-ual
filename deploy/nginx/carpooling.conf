# Nginx delante de la aplicación (RNF-04): HTTPS, cabeceras de seguridad,
# límite de peticiones por IP, el frontend compilado y la API en /api.
# Se copia a /etc/nginx/conf.d/carpooling.conf y se cambian:
#   - carpooling.example.org por el dominio del servidor
#   - las rutas del certificado (Let's Encrypt con certbot)
#   - /srv/carpooling/frontend/www por la carpeta del build del frontend
# Pasos en docs/despliegue.md, sección 9.

# Límite de peticiones por IP (las IP se guardan solo en memoria de Nginx):
# la API en general y, más estricto, el login (complementa el límite por
# correo de la aplicación, que no frena probar una contraseña en muchos
# correos desde la misma IP)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

upstream carpooling_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP solo redirige a HTTPS (y deja pasar la comprobación de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name carpooling.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name carpooling.example.org;

    ssl_certificate /etc/letsencrypt/live/carpooling.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carpooling.example.org/privkey.pem;
    # Configuración «intermedia» de Mozilla: TLS 1.2 y 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No anunciar la versión de Nginx
    server_tokens off;

    # Las avatares que sube un administrador (hasta 1 MB en la API)
    client_max_body_size 2m;

    # Cabeceras de seguridad para todas las respuestas, también los errores
    # (always). Ninguna location usa add_header: si lo hiciera, dejaría de
    # heredar estas.
    # - HSTS: un año, sin preload (eso obliga a todos los subdominios para
    #   siempre)
    # - CSP: solo recursos propios, salvo los mosaicos del mapa
    #   (tile.openstreetmap.org) y Firebase para las notificaciones web
    #   (*.googleapis.com). El hash permite el único script en línea del build
    #   de Angular (el que activa la hoja de estilos); si cambia al actualizar
    #   Angular, la app se ve sin estilos y hay que actualizarlo
    #   (docs/despliegue.md). Ionic necesita estilos en línea
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://*.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # API: al backend en el mismo servidor. ^~ para que una ruta de la API
    # acabada en .png (p. ej. un avatar) no la tome la location de estáticos
    location ^~ /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://carpooling_api;
        include /etc/nginx/snippets/carpooling-proxy.conf;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://carpooling_api;
        include /etc/nginx/snippets/carpooling-proxy.conf;
    }

    # Frontend compilado (npm run build en frontend/, carpeta www)
    root /srv/carpooling/frontend/www;

    # Los ficheros con hash en el nombre no cambian nunca: caché de un año
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # El resto son rutas de la app: index.html, siempre comprobando si hay
    # una versión nueva
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
