name: SonarCloud

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  sonarcloud:
    name: Analyze
    runs-on: ubuntu-latest

    # Base de datos para los tests e2e del backend (igual que en Backend CI)
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: carpooling
          POSTGRES_PASSWORD: carpooling_test
          POSTGRES_DB: carpooling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historial completo: Sonar lo usa para saber qué es código nuevo

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Un paso de cobertura por proyecto. Añadir el del frontend y los servicios cuando existan
      - name: Backend coverage
        if: hashFiles('backend/package.json') != ''
        working-directory: ./backend
        run: |
          npm ci
          npm run migrate
          npm run test:cov
        env:
          DATABASE_URL: postgresql://carpooling:carpooling_test@localhost:5432/carpooling_test

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
