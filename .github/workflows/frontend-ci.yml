name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter
        run: npm run lint

      # Vitest (sin navegador); falla si la cobertura de líneas baja del 80 %
      - name: Run tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      # Tests e2e (Cypress) contra la app con ng serve; la API se simula con
      # cy.intercept, así que no hacen falta backend ni base de datos
      - name: Run e2e tests
        run: |
          npm start &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:4200 > /dev/null && break
            sleep 2
          done
          npm run e2e -- --browser chrome
